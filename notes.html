<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes – OfficeWeb</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/notes.css" />
</head>
<body>

<!-- Title bar -->
<div class="titlebar">
  <a href="index.html" class="titlebar-home">
    <img src="logo.svg" alt="OfficeWeb" class="titlebar-logo" />
    <span data-i18n="common.home">Startseite</span>
  </a>
  <div style="color:rgba(255,255,255,.4)">|</div>
  <span class="titlebar-name" data-i18n="notes.appname">Notes</span>
  <button class="tb-btn" onclick="exportNote()">Exportieren</button>
  <input type="text" class="search-input" id="searchInput" placeholder="Notizen suchen..." data-i18n-placeholder="notes.search" oninput="filterNotes()" />
</div>

<!-- Main layout -->
<div class="main-layout">

  <!-- Sections -->
  <div class="sections-bar" id="sectionsBar">
    <!-- generated dynamically -->
  </div>

  <!-- Notes list -->
  <div class="notes-list">
    <div class="notes-list-header">
      <h3 id="sectionTitle">Notizen</h3>
      <button class="list-add-btn" onclick="newNote()" title="Neue Notiz">+</button>
    </div>
    <div class="notes-items" id="noteItems"></div>
  </div>

  <!-- Note editor -->
  <div class="note-editor" id="noteEditor">
    <div class="empty-state" id="emptyState">
      <div class="icon">📋</div>
      <p>Keine Notiz ausgewählt</p>
      <button onclick="newNote()">+ Neue Notiz erstellen</button>
    </div>
    <div id="editorPane" style="display:none; flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="note-editor-top">
        <input type="text" class="note-title-input" id="noteTitleInput" placeholder="Titel..." oninput="saveCurrentNote()" />
        <div class="note-toolbar">
          <button class="nb" onclick="nfmt('bold')" title="Fett"><b>B</b></button>
          <button class="nb" onclick="nfmt('italic')" title="Kursiv"><i>I</i></button>
          <button class="nb" onclick="nfmt('underline')" title="Unterstrichen"><u>U</u></button>
          <button class="nb" onclick="nfmt('strikeThrough')" title="Durchgestrichen"><s>S</s></button>
          <div class="nb-sep"></div>
          <button class="nb" onclick="nfmt('justifyLeft')" title="Links">⬅</button>
          <button class="nb" onclick="nfmt('justifyCenter')" title="Mitte">↔</button>
          <button class="nb" onclick="nfmt('justifyRight')" title="Rechts">➡</button>
          <div class="nb-sep"></div>
          <button class="nb" onclick="nfmt('insertUnorderedList')" title="Aufzählung">•≡</button>
          <button class="nb" onclick="nfmt('insertOrderedList')" title="Nummernliste">1≡</button>
          <button class="nb" onclick="insertCheckbox()" title="Aufgabe">☑</button>
          <div class="nb-sep"></div>
          <button class="nb" onclick="insertNoteHeading(1)">H1</button>
          <button class="nb" onclick="insertNoteHeading(2)">H2</button>
          <button class="nb" onclick="insertNoteHeading(3)">H3</button>
          <div class="nb-sep"></div>
          <select class="nb-select" id="noteFontSize" onchange="setNoteFont()">
            <option value="3">12px</option>
            <option value="4">14px</option>
            <option value="5" selected>16px</option>
            <option value="6">20px</option>
            <option value="7">28px</option>
          </select>
          <input type="color" id="noteTextColor" value="#000000" onchange="setNoteTextColor()" title="Textfarbe" style="width:26px; height:26px; padding:1px; border-radius:3px; border:1px solid #ddd; cursor:pointer;" />
          <input type="color" id="noteHilite" value="#ffff00" onchange="setNoteHilite()" title="Hervorheben" style="width:26px; height:26px; padding:1px; border-radius:3px; border:1px solid #ddd; cursor:pointer;" />
          <div class="nb-sep"></div>
          <button class="nb" onclick="document.execCommand('removeFormat')" title="Formatierung löschen">🧹</button>
        </div>
      </div>
      <div class="note-tags" id="noteTags"></div>
      <div class="note-body" id="noteBody" contenteditable="true" spellcheck="true" oninput="saveCurrentNote()"></div>
      <div class="note-meta">
        <span id="noteWordCount">Wörter: 0</span>
        <span id="noteModified"></span>
      </div>
    </div>
  </div>

</div>

<!-- Status bar -->
<div class="statusbar">
  <span data-i18n="notes.appname">Notes</span>
  <span id="statusMsg" data-i18n="common.ready">Bereit</span>
  <span id="noteCount" style="margin-left:auto;"></span>
</div>
<script src="js/i18n.js"></script>
<script src="js/notes.js"></script>
</body>
</html>

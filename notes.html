<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes – OfficeWeb</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7719aa; --purple-dark: #5c1483; --purple-light: #f0e6f9;
      --border: #d1d1d1; --bg: #f3f2f1; --text: #201f1e;
      --sidebar-bg: #fff; --hover: #f0f0f0;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Title bar */
    .titlebar { background: var(--purple); color: #fff; height: 40px; display: flex; align-items: center; padding: 0 12px; gap: 8px; flex-shrink: 0; }
    .titlebar-home { color: rgba(255,255,255,.85); text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 3px; }
    .titlebar-home:hover { background: rgba(255,255,255,.15); }
    .titlebar-name { font-size: 14px; font-weight: 600; }
    .tb-btn { padding: 5px 14px; border-radius: 3px; font-size: 13px; cursor: pointer; border: none; font-weight: 600; background: rgba(255,255,255,.15); color: #fff; margin-left: 4px; }
    .tb-btn:hover { background: rgba(255,255,255,.25); }
    .search-input { margin-left: auto; background: rgba(255,255,255,.15); border: none; color: #fff; padding: 5px 12px; border-radius: 16px; font-size: 13px; outline: none; width: 200px; }
    .search-input::placeholder { color: rgba(255,255,255,.6); }
    .search-input:focus { background: rgba(255,255,255,.25); }

    /* Main layout */
    .main-layout { flex: 1; display: flex; overflow: hidden; }

    /* Sections sidebar */
    .sections-bar { width: 56px; background: #2d2d2d; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; flex-shrink: 0; }
    .section-btn { width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: rgba(255,255,255,.6); border: 2px solid transparent; transition: all .15s; }
    .section-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .section-btn.active { background: var(--purple); color: #fff; border-color: rgba(255,255,255,.3); }
    .section-add { margin-top: auto; width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; color: rgba(255,255,255,.5); }
    .section-add:hover { color: #fff; }

    /* Notes list */
    .notes-list { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    .notes-list-header { padding: 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .notes-list-header h3 { font-size: 15px; font-weight: 700; flex: 1; }
    .list-add-btn { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: var(--purple); color: #fff; cursor: pointer; font-size: 18px; border: none; }
    .list-add-btn:hover { background: var(--purple-dark); }
    .notes-items { flex: 1; overflow-y: auto; }
    .note-item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background .1s; position: relative; }
    .note-item:hover { background: var(--hover); }
    .note-item.active { background: var(--purple-light); border-left: 3px solid var(--purple); }
    .note-item-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-item-preview { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-item-date { font-size: 11px; color: #aaa; margin-top: 2px; }
    .note-item-del { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); opacity: 0; font-size: 14px; color: #999; cursor: pointer; background: none; border: none; padding: 2px 6px; }
    .note-item:hover .note-item-del { opacity: 1; }
    .note-item-del:hover { color: red; }

    /* Note editor */
    .note-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .note-editor-top { padding: 12px 24px 6px; border-bottom: 1px solid var(--border); background: #fff; flex-shrink: 0; }
    .note-title-input { font-size: 22px; font-weight: 700; border: none; outline: none; width: 100%; color: var(--text); background: transparent; }
    .note-toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 0; flex-wrap: wrap; }
    .nb { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; cursor: pointer; border-radius: 3px; font-size: 14px; color: var(--text); }
    .nb:hover { background: var(--hover); }
    .nb.active { background: var(--purple-light); color: var(--purple); }
    .nb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
    select.nb-select { height: 26px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px; background: #fff; cursor: pointer; padding: 0 4px; }
    .note-body { flex: 1; overflow-y: auto; padding: 24px; outline: none; font-size: 15px; line-height: 1.8; color: var(--text); background: #fff; }
    .note-body:empty::before { content: 'Notiz hier eingeben...'; color: #aaa; }
    .note-body h1 { font-size: 24px; margin: 8px 0; }
    .note-body h2 { font-size: 20px; margin: 6px 0; }
    .note-body h3 { font-size: 16px; margin: 4px 0; }
    .note-body ul, .note-body ol { padding-left: 24px; }
    .note-body blockquote { border-left: 3px solid var(--purple); padding: 6px 14px; color: #555; background: #faf5ff; margin: 6px 0; }
    .note-body input[type=checkbox] { margin-right: 6px; }
    .note-meta { padding: 6px 24px; font-size: 12px; color: #aaa; background: #fafafa; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 16px; }

    /* Empty state */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; gap: 12px; }
    .empty-state .icon { font-size: 64px; }
    .empty-state p { font-size: 16px; }
    .empty-state button { padding: 10px 24px; background: var(--purple); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }

    /* Status bar */
    .statusbar { background: var(--purple); color: rgba(255,255,255,.85); height: 24px; display: flex; align-items: center; padding: 0 12px; gap: 24px; font-size: 12px; flex-shrink: 0; }

    /* Tags */
    .note-tags { padding: 0 24px 8px; display: flex; flex-wrap: wrap; gap: 6px; background: #fff; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 12px; background: var(--purple-light); color: var(--purple); cursor: pointer; }
    .tag .tag-del { opacity: .6; cursor: pointer; }
    .tag .tag-del:hover { opacity: 1; color: red; }
    .tag-add { background: transparent; border: 1px dashed #ccc; color: #aaa; }
    .tag-add:hover { border-color: var(--purple); color: var(--purple); }

    /* Checklist highlight */
    .note-body .task-line { display: flex; align-items: flex-start; gap: 8px; }
  </style>
</head>
<body>

<!-- Title bar -->
<div class="titlebar">
  <a href="index.html" class="titlebar-home">🏠 Startseite</a>
  <div style="color:rgba(255,255,255,.4)">|</div>
  <span class="titlebar-name">📋 Notes</span>
  <button class="tb-btn" onclick="exportNote()">📤 Exportieren</button>
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 Notizen suchen..." oninput="filterNotes()" />
</div>

<!-- Main layout -->
<div class="main-layout">

  <!-- Sections -->
  <div class="sections-bar" id="sectionsBar">
    <!-- generated dynamically -->
  </div>

  <!-- Notes list -->
  <div class="notes-list">
    <div class="notes-list-header">
      <h3 id="sectionTitle">Notizen</h3>
      <button class="list-add-btn" onclick="newNote()" title="Neue Notiz">+</button>
    </div>
    <div class="notes-items" id="noteItems"></div>
  </div>

  <!-- Note editor -->
  <div class="note-editor" id="noteEditor">
    <div class="empty-state" id="emptyState">
      <div class="icon">📋</div>
      <p>Keine Notiz ausgewählt</p>
      <button onclick="newNote()">+ Neue Notiz erstellen</button>
    </div>
    <div id="editorPane" style="display:none; flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="note-editor-top">
        <input type="text" class="note-title-input" id="noteTitleInput" placeholder="Titel..." oninput="saveCurrentNote()" />
        <div class="note-toolbar">
          <button class="nb" onclick="nfmt('bold')" title="Fett"><b>B</b></button>
          <button class="nb" onclick="nfmt('italic')" title="Kursiv"><i>I</i></button>
          <button class="nb" onclick="nfmt('underline')" title="Unterstrichen"><u>U</u></button>
          <button class="nb" onclick="nfmt('strikeThrough')" title="Durchgestrichen"><s>S</s></button>
          <div class="nb-sep"></div>
          <button class="nb" onclick="nfmt('justifyLeft')" title="Links">⬅</button>
          <button class="nb" onclick="nfmt('justifyCenter')" title="Mitte">↔</button>
          <button class="nb" onclick="nfmt('justifyRight')" title="Rechts">➡</button>
          <div class="nb-sep"></div>
          <button class="nb" onclick="nfmt('insertUnorderedList')" title="Aufzählung">•≡</button>
          <button class="nb" onclick="nfmt('insertOrderedList')" title="Nummernliste">1≡</button>
          <button class="nb" onclick="insertCheckbox()" title="Aufgabe">☑</button>
          <div class="nb-sep"></div>
          <button class="nb" onclick="insertNoteHeading(1)">H1</button>
          <button class="nb" onclick="insertNoteHeading(2)">H2</button>
          <button class="nb" onclick="insertNoteHeading(3)">H3</button>
          <div class="nb-sep"></div>
          <select class="nb-select" id="noteFontSize" onchange="setNoteFont()">
            <option value="3">12px</option>
            <option value="4">14px</option>
            <option value="5" selected>16px</option>
            <option value="6">20px</option>
            <option value="7">28px</option>
          </select>
          <input type="color" id="noteTextColor" value="#000000" onchange="setNoteTextColor()" title="Textfarbe" style="width:26px; height:26px; padding:1px; border-radius:3px; border:1px solid #ddd; cursor:pointer;" />
          <input type="color" id="noteHilite" value="#ffff00" onchange="setNoteHilite()" title="Hervorheben" style="width:26px; height:26px; padding:1px; border-radius:3px; border:1px solid #ddd; cursor:pointer;" />
          <div class="nb-sep"></div>
          <button class="nb" onclick="document.execCommand('removeFormat')" title="Formatierung löschen">🧹</button>
        </div>
      </div>
      <div class="note-tags" id="noteTags"></div>
      <div class="note-body" id="noteBody" contenteditable="true" spellcheck="true" oninput="saveCurrentNote()"></div>
      <div class="note-meta">
        <span id="noteWordCount">Wörter: 0</span>
        <span id="noteModified"></span>
      </div>
    </div>
  </div>

</div>

<!-- Status bar -->
<div class="statusbar">
  <span>📋 Notes</span>
  <span id="statusMsg">Bereit</span>
  <span id="noteCount" style="margin-left:auto;"></span>
</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let sections = [
  { id: 's1', name: 'Persönlich', icon: '📋', color: '#7719aa' },
  { id: 's2', name: 'Arbeit',     icon: '💼', color: '#0078d4' },
  { id: 's3', name: 'Aufgaben',   icon: '✅', color: '#217346' },
];
let currentSectionId = 's1';
let notes = loadNotes();
let currentNoteId = null;

function loadNotes() {
  try { return JSON.parse(localStorage.getItem('notes_data') || '{}'); } catch { return {}; }
}
function saveNotesStorage() {
  localStorage.setItem('notes_data', JSON.stringify(notes));
}
function getSections() {
  try {
    const s = JSON.parse(localStorage.getItem('notes_sections'));
    if (s && s.length) return s;
  } catch {}
  return sections;
}
function saveSections() {
  localStorage.setItem('notes_sections', JSON.stringify(sections));
}

// ─── Sections ────────────────────────────────────────────────────────────────
function renderSections() {
  const bar = document.getElementById('sectionsBar');
  bar.innerHTML = '';
  sections.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'section-btn' + (s.id === currentSectionId ? ' active' : '');
    btn.title = s.name;
    btn.textContent = s.icon;
    btn.style.setProperty('--sec-color', s.color);
    if (s.id === currentSectionId) btn.style.background = s.color;
    btn.addEventListener('click', () => switchSection(s.id));
    bar.appendChild(btn);
  });
  const add = document.createElement('div');
  add.className = 'section-add'; add.textContent = '+';
  add.title = 'Neuer Abschnitt';
  add.addEventListener('click', addSection);
  bar.appendChild(add);
}

function switchSection(id) {
  currentSectionId = id;
  currentNoteId = null;
  const sec = sections.find(s => s.id === id);
  if (sec) document.getElementById('sectionTitle').textContent = sec.name;
  renderSections();
  renderNoteList();
  showEmptyState();
}

function addSection() {
  const name = prompt('Name des Abschnitts:', 'Neuer Abschnitt');
  if (!name) return;
  const icons = ['📋','📌','📎','🗒','🔖','📝','💡','⭐','🎯'];
  const colors = ['#7719aa','#0078d4','#217346','#c0392b','#d4830a','#00796b'];
  const s = { id: 's' + Date.now(), name, icon: icons[sections.length % icons.length], color: colors[sections.length % colors.length] };
  sections.push(s);
  saveSections();
  switchSection(s.id);
}

// ─── Notes list ──────────────────────────────────────────────────────────────
function getSectionNotes() {
  return Object.values(notes).filter(n => n.section === currentSectionId).sort((a, b) => b.modified - a.modified);
}

function renderNoteList(filter = '') {
  const container = document.getElementById('noteItems');
  let list = getSectionNotes();
  if (filter) list = list.filter(n => (n.title + ' ' + (n.body || '')).toLowerCase().includes(filter.toLowerCase()));
  container.innerHTML = '';
  list.forEach(n => {
    const item = document.createElement('div');
    item.className = 'note-item' + (n.id === currentNoteId ? ' active' : '');
    item.innerHTML = `
      <div class="note-item-title">${escHtml(n.title || 'Ohne Titel')}</div>
      <div class="note-item-preview">${escHtml(stripTags(n.body || '').slice(0, 60))}</div>
      <div class="note-item-date">${formatDate(n.modified)}</div>
      <button class="note-item-del" onclick="deleteNote(event, '${n.id}')">✕</button>
    `;
    item.addEventListener('click', () => openNote(n.id));
    container.appendChild(item);
  });
  document.getElementById('noteCount').textContent = `${list.length} Notiz${list.length !== 1 ? 'en' : ''}`;
}

function filterNotes() {
  renderNoteList(document.getElementById('searchInput').value);
}

// ─── Note operations ──────────────────────────────────────────────────────────
function newNote() {
  const id = 'n' + Date.now();
  notes[id] = { id, section: currentSectionId, title: '', body: '', tags: [], modified: Date.now(), created: Date.now() };
  saveNotesStorage();
  openNote(id);
  renderNoteList();
  setTimeout(() => document.getElementById('noteTitleInput').focus(), 50);
}

function openNote(id) {
  currentNoteId = id;
  const note = notes[id];
  if (!note) return;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorPane').style.display = 'flex';
  document.getElementById('noteTitleInput').value = note.title || '';
  document.getElementById('noteBody').innerHTML = note.body || '';
  renderNoteTags(note);
  updateNoteWordCount();
  document.getElementById('noteModified').textContent = 'Geändert: ' + formatDate(note.modified);
  renderNoteList();
}

function saveCurrentNote() {
  if (!currentNoteId || !notes[currentNoteId]) return;
  const note = notes[currentNoteId];
  note.title = document.getElementById('noteTitleInput').value;
  note.body = document.getElementById('noteBody').innerHTML;
  note.modified = Date.now();
  saveNotesStorage();
  updateNoteWordCount();
  document.getElementById('noteModified').textContent = 'Geändert: ' + formatDate(note.modified);
  // update preview in list
  const item = document.querySelector('.note-item.active');
  if (item) {
    const titleEl = item.querySelector('.note-item-title');
    const previewEl = item.querySelector('.note-item-preview');
    if (titleEl) titleEl.textContent = note.title || 'Ohne Titel';
    if (previewEl) previewEl.textContent = stripTags(note.body || '').slice(0, 60);
  }
}

function deleteNote(e, id) {
  e.stopPropagation();
  if (!confirm('Notiz löschen?')) return;
  delete notes[id];
  saveNotesStorage();
  if (currentNoteId === id) { currentNoteId = null; showEmptyState(); }
  renderNoteList();
}

function showEmptyState() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('editorPane').style.display = 'none';
}

// ─── Tags ────────────────────────────────────────────────────────────────────
function renderNoteTags(note) {
  const el = document.getElementById('noteTags');
  el.innerHTML = '';
  (note.tags || []).forEach(tag => {
    const t = document.createElement('span');
    t.className = 'tag';
    t.innerHTML = `${escHtml(tag)} <span class="tag-del" onclick="removeTag('${escHtml(tag)}')">✕</span>`;
    el.appendChild(t);
  });
  const add = document.createElement('span');
  add.className = 'tag tag-add'; add.textContent = '+ Tag';
  add.addEventListener('click', addTag);
  el.appendChild(add);
}

function addTag() {
  const tag = prompt('Tag-Name:');
  if (!tag || !currentNoteId) return;
  const note = notes[currentNoteId];
  if (!note.tags.includes(tag)) note.tags.push(tag);
  saveNotesStorage();
  renderNoteTags(note);
}

function removeTag(tag) {
  if (!currentNoteId) return;
  const note = notes[currentNoteId];
  note.tags = note.tags.filter(t => t !== tag);
  saveNotesStorage();
  renderNoteTags(note);
}

// ─── Editor formatting ────────────────────────────────────────────────────────
const noteBody = document.getElementById('noteBody');
function nfmt(cmd) { noteBody.focus(); document.execCommand(cmd, false, null); }
function insertNoteHeading(n) { noteBody.focus(); document.execCommand('formatBlock', false, 'h' + n); }
function setNoteFont() { noteBody.focus(); document.execCommand('fontSize', false, document.getElementById('noteFontSize').value); }
function setNoteTextColor() { noteBody.focus(); document.execCommand('foreColor', false, document.getElementById('noteTextColor').value); }
function setNoteHilite() { noteBody.focus(); document.execCommand('hiliteColor', false, document.getElementById('noteHilite').value); }

function insertCheckbox() {
  noteBody.focus();
  document.execCommand('insertHTML', false, '<div><input type="checkbox" /> </div>');
}

function updateNoteWordCount() {
  const text = noteBody.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('noteWordCount').textContent = 'Wörter: ' + words;
}

// ─── Export ──────────────────────────────────────────────────────────────────
function exportNote() {
  if (!currentNoteId || !notes[currentNoteId]) { setStatus('Keine Notiz ausgewählt'); return; }
  const note = notes[currentNoteId];
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escHtml(note.title)}</title><style>body{font-family:Segoe UI,sans-serif;max-width:700px;margin:40px auto;padding:0 20px;line-height:1.7;}h1{font-size:28px;}</style></head><body><h1>${escHtml(note.title)}</h1>${note.body}</body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = (note.title || 'notiz') + '.html';
  a.click();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripTags(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'});
}

function setStatus(msg) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  setTimeout(() => el.textContent = 'Bereit', 3000);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'n') { e.preventDefault(); newNote(); }
  }
});

// ─── Init ────────────────────────────────────────────────────────────────────
sections = getSaved_sections();
function getSaved_sections() {
  try {
    const s = JSON.parse(localStorage.getItem('notes_sections'));
    if (s && s.length) return s;
  } catch {}
  return sections;
}

renderSections();
document.getElementById('sectionTitle').textContent = sections[0]?.name || 'Notizen';
renderNoteList();

// Auto-save
setInterval(() => { if (currentNoteId) saveCurrentNote(); }, 10000);
</script>
</body>
</html>

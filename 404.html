<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OfficeWeb</title>
</head>
<body>
<script>
  // Redirect /{lang}/{app}/ URLs: save the language, then load the app page.
  var EU_LANGS = ['bg','cs','da','de','el','en','es','et','fi','fr','ga','hr','hu','it','lt','lv','mt','nl','pl','pt','ro','sk','sl','sv'];
  var segs = location.pathname.replace(/^\/|\/$/g, '').split('/').filter(Boolean);
  if (segs.length >= 1 && EU_LANGS.indexOf(segs[0]) !== -1) {
    var lang = segs[0];
    var app  = segs[1] || '';
    localStorage.setItem('owlang', lang);
    location.replace(app ? '/' + app + '/' : '/');
  } else {
    location.replace('/');
  }
</script>
</body>
</html>

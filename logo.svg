<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#004578"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="40" ry="40" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="200" height="100" rx="40" ry="40" fill="url(#shine)"/>
  <!-- Document stack icon -->
  <!-- Back document -->
  <rect x="70" y="48" width="76" height="96" rx="6" ry="6" fill="rgba(255,255,255,0.25)" transform="rotate(-6,108,96)"/>
  <!-- Middle document -->
  <rect x="62" y="52" width="76" height="96" rx="6" ry="6" fill="rgba(255,255,255,0.45)" transform="rotate(-2,100,100)"/>
  <!-- Front document -->
  <rect x="54" y="56" width="76" height="96" rx="6" ry="6" fill="#ffffff"/>
  <!-- Document lines -->
  <rect x="66" y="76" width="52" height="5" rx="2" fill="#0078d4" opacity="0.8"/>
  <rect x="66" y="88" width="44" height="4" rx="2" fill="#0078d4" opacity="0.4"/>
  <rect x="66" y="99" width="48" height="4" rx="2" fill="#0078d4" opacity="0.4"/>
  <rect x="66" y="110" width="36" height="4" rx="2" fill="#0078d4" opacity="0.4"/>
  <!-- "O" letter on front doc -->
  <text x="76" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#0078d4" letter-spacing="-1">OW</text>
</svg>

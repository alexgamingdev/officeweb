<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impress – OfficeWeb</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/impress.css" />
</head>
<body>

<!-- Title bar -->
<div class="titlebar">
  <a href="index.html" class="titlebar-home">
    <img src="logo.svg" alt="OfficeWeb" class="titlebar-logo" />
    <span data-i18n="common.home">Startseite</span>
  </a>
  <div style="color:rgba(255,255,255,.4)">|</div>
  <span class="titlebar-name" data-i18n="impress.appname">Impress</span>
  <div class="titlebar-file">
    <input type="text" id="docTitle" value="Unbenannte Präsentation" />
  </div>
  <button class="tb-btn" onclick="savePresentation()" data-i18n="common.save">Speichern</button>
  <button class="tb-btn" onclick="newPresentation()" data-i18n="common.new">Neu</button>
  <button class="tb-btn" onclick="openPresentation()">Öffnen</button>
  <button class="tb-btn tb-btn-present" onclick="startPresent()">▶ Präsentieren</button>
</div>

<!-- Ribbon -->
<div class="ribbon">
  <div class="ribbon-group">
    <button class="rb" onclick="addSlide()" title="Neue Folie">+ Folie</button>
    <button class="rb" onclick="duplicateSlide()" title="Folie duplizieren">⧉</button>
    <button class="rb" onclick="deleteCurrentSlide()" title="Folie löschen" style="color:red;">🗑 Folie</button>
  </div>
  <div class="ribbon-group">
    <button class="rb" onclick="addTextElement()" title="Textfeld hinzufügen">T+ Text</button>
    <button class="rb" onclick="addImageElement()" title="Bild hinzufügen">🖼 Bild</button>
    <button class="rb" onclick="addShapeRect()" title="Rechteck">▭ Rechteck</button>
    <button class="rb" onclick="addShapeCircle()" title="Kreis">○ Kreis</button>
  </div>
  <div class="ribbon-group">
    <button class="rb" onclick="moveSlideUp()" title="Folie nach oben">↑</button>
    <button class="rb" onclick="moveSlideDown()" title="Folie nach unten">↓</button>
  </div>
  <div class="ribbon-group">
    <select class="rb-select" id="layoutSelect" onchange="applyLayout()" title="Layout">
      <option value="blank">Leer</option>
      <option value="title" selected>Titel</option>
      <option value="content">Inhalt</option>
      <option value="two-col">Zwei Spalten</option>
    </select>
  </div>
  <div class="ribbon-group">
    <button class="rb" onclick="window.print()" title="Drucken">🖨</button>
  </div>
</div>

<!-- Main layout -->
<div class="main-layout">

  <!-- Slide thumbnail panel -->
  <div class="slide-panel" id="slidePanel"></div>

  <!-- Edit canvas -->
  <div class="edit-area" id="editArea">
    <div class="slide-canvas-wrap" id="canvasWrap">
      <div class="slide-canvas" id="slideCanvas"></div>
    </div>
  </div>

  <!-- Properties panel -->
  <div class="props-panel">
    <h4>Folie</h4>
    <div class="prop-row">
      <label>Hintergrundfarbe</label>
      <input type="color" id="slideBgColor" value="#ffffff" oninput="setSlideBackground()" />
    </div>
    <div class="prop-row">
      <label>Hintergrundbild-URL</label>
      <input type="text" id="slideBgImg" placeholder="https://..." oninput="setSlideBackground()" />
    </div>
    <button class="prop-btn prop-btn-secondary" onclick="clearSlideBg()">Hintergrund löschen</button>

    <h4 style="margin-top:16px;">Ausgewähltes Element</h4>
    <div id="elProps">
      <p style="color:#777; font-size:12px;">Kein Element ausgewählt</p>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="statusbar">
  <span data-i18n="impress.appname">Impress</span>
  <span id="statusMsg" data-i18n="common.ready">Bereit</span>
  <span id="slideCounter" style="margin-left:auto;"></span>
</div>

<!-- Present mode overlay -->
<div class="present-overlay" id="presentOverlay">
  <div class="present-exit" onclick="endPresent()">✕ Beenden (Esc)</div>
  <div class="present-counter" id="presentCounter"></div>
  <div class="present-slide" id="presentSlide"></div>
  <div class="present-nav">
    <button onclick="prevPresentSlide()">← Zurück</button>
    <button onclick="nextPresentSlide()">Weiter →</button>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="imgElModal">
  <div class="modal">
    <h3>Bild einfügen</h3>
    <label>Bild-URL</label>
    <input type="url" id="imgElURL" placeholder="https://..." />
    <label>Oder Datei:</label>
    <input type="file" id="imgElFile" accept="image/*" onchange="handleImgElFile()" style="border:none; padding:0;" />
    <div class="modal-btns">
      <button onclick="closeModal('imgElModal')">Abbrechen</button>
      <button class="btn-ok" onclick="doAddImageElement()">Einfügen</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="openModal">
  <div class="modal">
    <h3>Präsentation öffnen</h3>
    <label>Gespeicherte Präsentationen:</label>
    <select id="pressList" size="6" style="height:140px; margin-bottom:12px;"></select>
    <div class="modal-btns">
      <button onclick="closeModal('openModal')">Abbrechen</button>
      <button onclick="deleteSelectedPres()" style="color:red;">Löschen</button>
      <button class="btn-ok" onclick="loadSelectedPres()">Öffnen</button>
    </div>
  </div>
</div>
<script src="js/i18n.js"></script>
<script src="js/impress.js"></script>
</body>
</html>
